apiVersion: agones.dev/v1
kind: GameServer
metadata:
  name: networking-lab-nfe
  labels:
    lab.unity/network-stack: nfe
spec:
  ports:
    - name: game
      portPolicy: Static
      containerPort: 7980
      hostPort: 7980
      protocol: UDP
  health:
    initialDelaySeconds: 30
    periodSeconds: 5
    failureThreshold: 5
  template:
    spec:
      nodeSelector:
        kubernetes.io/arch: amd64
      containers:
        - name: unity-server
          image: networking-lab-nfe:local
          imagePullPolicy: IfNotPresent
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
